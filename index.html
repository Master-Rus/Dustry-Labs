      background-position:center;
      filter: saturate(1.12) brightness(1.07);
      transform: scale(1.08);
      animation:bg-drift 15s ease-in-out infinite alternate;
      will-change: transform;
    }
    .bg::after {
      content:"";
      z-index:2; pointer-events:none;
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 50% 42%, rgba(5,13,23,.14) 0%, rgba(5,13,23,.38) 32%, rgba(4,10,18,.70) 72%, rgba(3,8,14,.90) 100%),
        linear-gradient(to bottom, rgba(3,7,13,.28), transparent 24%, transparent 72%, rgba(3,7,13,.52));
    }
    #signals {
      position:absolute; inset:0; display:block;
      width:100%; height:100%;
      pointer-events:none;
      mix-blend-mode:screen;
      opacity:.96;
    }
    .grid {
      position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.15;
      background-image:
        linear-gradient(rgba(110,145,193,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,145,193,.18) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image: radial-gradient(circle at 50% 44%, rgba(0,0,0,.95), transparent 92%);
      animation:grid-float 18s linear infinite;
    }
    .grain {
      position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.14;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.81' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.17'/%3E%3C/svg%3E");
    }
    .shell {
      position:relative; z-index:3;
      display:flex; align-items:center; justify-content:center;
      width:100%; min-height:100svh; padding:24px; isolation:isolate;
    }
    .center-glow {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      pointer-events:none; z-index:-1; height:700px; width:min(1100px,112vw);
      background:radial-gradient(ellipse, rgba(4,10,18,.80) 0%, rgba(4,10,18,.72) 30%, rgba(4,10,18,.42) 54%, rgba(4,10,18,.12) 70%, transparent 82%);
    }
    .content {
      text-align:center; width:min(840px,100%);
      padding:28px 26px 26px;
      background:linear-gradient(180deg, rgba(7,14,24,.38), rgba(7,14,24,.20));
      border:1px solid rgba(194,206,220,.08);
      border-radius:26px;
      box-shadow:0 22px 70px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.03);
      backdrop-filter: blur(8px);
      animation:arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes arrive { from {opacity:0; transform:translateY(18px);} to {opacity:1; transform:translateY(0);} }
    @keyframes bg-drift {
      0% { transform:scale(1.08) translate3d(-1.3%, -1%, 0); }
      100% { transform:scale(1.13) translate3d(1.2%, 1%, 0); }
    }
    @keyframes grid-float {
      from { transform:translateY(0); }
      to { transform:translateY(42px); }
    }
    .mark { display:flex; justify-content:center; align-items:center; height:108px; margin-bottom:20px; }
    .mark img { width:auto; height:102px; max-width:100%; object-fit:contain; filter:drop-shadow(0 6px 22px rgba(84,169,255,.23)); }
    .eyebrow {
      display:flex; justify-content:center; align-items:center; gap:15px;
      color:#ddb06a; font:700 12px/1.4 Consolas,'Courier New',monospace;
      letter-spacing:.29em; text-transform:uppercase; margin:0 0 15px;
    }
    .eyebrow:before, .eyebrow:after { content:''; width:38px; height:1px; background:linear-gradient(90deg,transparent,rgba(244,186,89,.8)); }
    .eyebrow:after { transform:rotate(180deg); }
    h1 {
      text-align:center; font-family:Impact, 'Arial Black', 'Trebuchet MS',sans-serif; font-stretch:condensed;
      font-size:clamp(2.8rem, 6.8vw, 5.2rem); letter-spacing:.06em; line-height:1; font-weight:900; margin:0;
      text-shadow:0 3px 0 rgba(0,0,0,.65), 0 10px 40px rgba(0,0,0,.78); white-space:nowrap;
    }
    h1 .name { background:linear-gradient(to bottom,#fff 22%,#e1e4e9 70%,#abb5c1); color:transparent; background-clip:text; -webkit-background-clip:text; }
    h1 .dotru { color:var(--gold); text-shadow:0 0 24px rgba(244,186,89,.11); }
    .divider { position:relative; width:190px; height:1px; margin:30px auto 26px; background:linear-gradient(90deg,transparent,rgba(248,192,89,.82) 48%,transparent); }
    .divider:before { content:''; position:absolute; left:calc(50% - 3px); top:-3px; height:7px;width:7px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 15px rgba(252,184,77,.65); }
    .subtitle { font-size:clamp(1.35rem, 2.4vw, 1.9rem); font-weight:700; letter-spacing:.04em; margin:0; color:#f2f3f4; text-shadow:0 3px 18px #000; }
    .support { color:var(--muted); font-size:clamp(.96rem,1.35vw,1.1rem); font-weight:400; margin:14px auto 0; letter-spacing:.025em; line-height:1.65; max-width:620px; }
    .actions { display:flex; justify-content:center; margin-top:28px; }
    .play-btn {
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      min-width:190px; padding:0 24px; height:54px; border-radius:14px;
      color:#09111b; background:linear-gradient(180deg,var(--button),#e79a31);
      border:1px solid rgba(255,211,138,.65); text-decoration:none; font-weight:800;
      font-size:1rem; letter-spacing:.06em; text-transform:uppercase;
      box-shadow:0 10px 28px rgba(239,170,67,.20), inset 0 1px 0 rgba(255,245,219,.45);
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .play-btn:hover { transform:translateY(-2px); background:linear-gradient(180deg,var(--button-hover),#efa640); box-shadow:0 14px 32px rgba(239,170,67,.28), inset 0 1px 0 rgba(255,245,219,.5); }
    .play-btn:active { transform:translateY(0); }
    .play-btn svg { width:18px; height:18px; }
    .status { display:inline-flex; align-items:center; gap:11px; margin-top:24px; color:#abb5be; font:600 11px/1.5 Consolas,'Courier New',monospace; letter-spacing:.18em; }
    .status-light { width:9px; height:9px; border-radius:50%; background:#7890aa; box-shadow:0 0 0 4px rgba(120,144,170,.10); animation:blink 2.1s ease-in-out infinite; transition:background .25s ease,box-shadow .25s ease; }
    .status-light.is-online { background:#33e2ba; box-shadow:0 0 0 4px rgba(51,226,186,.09),0 0 16px rgba(51,226,186,.5); }
    .status-light.is-offline { background:#f26370; box-shadow:0 0 0 4px rgba(242,99,112,.10),0 0 16px rgba(242,99,112,.48); }
    @keyframes blink { 50% {opacity:.32;box-shadow:0 0 0 3px rgba(51,226,186,.04);} }
    .frame-corner { position:fixed; z-index:4; width:26px; height:26px; pointer-events:none; border-color:var(--line); border-style:solid; }
    .frame-corner.tl {top:31px;left:31px;border-width:1px 0 0 1px;}
    .frame-corner.tr {top:31px;right:31px;border-width:1px 1px 0 0;}
    .frame-corner.bl {bottom:31px;left:31px;border-width:0 0 1px 1px;}
    .frame-corner.br {bottom:31px;right:31px;border-width:0 1px 1px 0;}
    .foot {position:fixed;z-index:5;bottom:25px;left:50%;transform:translateX(-50%);font:10px Consolas,'Courier New',monospace;letter-spacing:.13em;color:rgba(188,199,208,.52);white-space:nowrap;pointer-events:none;}
    @media(max-width:670px) {
      .shell {padding:18px;}
      .content {padding:22px 18px 22px; border-radius:20px;}
      h1 {font-size:clamp(2.35rem,10vw,4rem);letter-spacing:.035em;white-space:normal;}
      .mark {height:84px;margin-bottom:15px;} .mark img {height:82px;}
      .eyebrow {font-size:9px;letter-spacing:.19em;gap:9px;margin-bottom:16px;} .eyebrow:before,.eyebrow:after {width:19px;}
      .divider {margin:24px auto 22px;} .subtitle {font-size:1.22rem;}
      .support {line-height:1.62;max-width:290px;font-size:.95rem;}
      .actions {margin-top:24px;}
      .play-btn {width:100%; max-width:300px; min-width:0; height:52px; font-size:.95rem;}
      .status {font-size:9px;margin-top:22px;}
      .frame-corner.tl{top:16px;left:16px} .frame-corner.tr{top:16px;right:16px} .frame-corner.bl{bottom:16px;left:16px} .frame-corner.br{bottom:16px;right:16px}
      .frame-corner{width:18px;height:18px}
      .foot {bottom:20px;font-size:9px}
    }
    @media (prefers-reduced-motion:reduce) { .content,.status-light,.bg .scene,.grid{animation:none} }

    /* Live counters are compact and visually integrated into the existing splash. */
    .live-stats {
      margin:24px auto 0; max-width:695px; padding:15px 18px 14px;
      background:linear-gradient(180deg,rgba(9,19,33,.78),rgba(9,19,33,.54));
      border:1px solid rgba(147,180,215,.18); border-radius:17px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    }
    .live-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:13px; }
    .live-heading { display:inline-flex; align-items:center; gap:9px; color:#cad6e3; font:700 10px/1.4 Consolas,'Courier New',monospace; letter-spacing:.13em; }
    .live-heading .status-light { display:inline-block; flex:none; animation:blink 2.1s ease-in-out infinite; }
    .live-sync { color:#718ba8; font:600 10px/1.4 Consolas,'Courier New',monospace; letter-spacing:.06em; white-space:nowrap; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; }
    .stat-item { min-width:0; padding:7px 11px 6px; }
    .stat-item + .stat-item { border-left:1px solid rgba(147,180,215,.16); }
    .stat-number { color:#eaf3ff; font-size:clamp(1.25rem,2.7vw,1.7rem); font-weight:700; line-height:1.3; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .stat-number.stat-server {font-size:clamp(1rem,2vw,1.16rem);padding-top:5px;color:#98b3cb}
    .stat-number.stat-version {font-size:clamp(1rem,2vw,1.19rem);padding-top:5px;color:#c5d9f1}
    .stat-server.is-online { color:#62e1bc; }
    .stat-server.is-offline { color:#d2a877; }
    .stat-label { margin-top:3px; color:#9aaec5; font-size:clamp(.72rem,1.4vw,.79rem); line-height:1.4; }
    .features { margin-top:13px; padding-top:12px; border-top:1px solid rgba(147,180,215,.12); font-size:12px; color:#adbed1; letter-spacing:.01em; line-height:1.55; }
    .features span { padding:0 7px;color:#d89b4f; }
    @media (max-width:670px) {
      html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
      .shell {min-height:100svh;padding-top:28px;padding-bottom:60px}
      .live-stats {padding:13px 9px 12px; margin-top:20px;}
      .live-heading {font-size:9px; letter-spacing:.04em;}
      .live-sync {font-size:9px; letter-spacing:0;}
      .stat-item {padding:7px 5px 5px;}
      .stat-number {font-size:clamp(1.05rem,4.2vw,1.3rem);}
      .stat-grid {grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px;}
      .stat-item:nth-child(3) {border-left:0;}
      .stat-item:nth-child(n+3) {border-top:1px solid rgba(147,180,215,.12);padding-top:11px;}
      .stat-number.stat-server,.stat-number.stat-version {font-size:clamp(.98rem,3.6vw,1.12rem);}
      .stat-label {font-size:11px;}
      .features {font-size:11px;line-height:1.8;}
      .features span {padding:0 3px;}
      .foot{position:relative;z-index:5;bottom:auto;left:auto;transform:none;text-align:center;margin:-40px 0 18px;}
    }
    @media (max-height:650px) and (min-width:671px) {
      html,body{height:auto;min-height:100%;overflow-y:auto}
      .shell{padding-top:30px;padding-bottom:55px}
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('signals');
      const scene = document.querySelector('.bg .scene');
      if (!canvas || !scene) return;
      const ctx = canvas.getContext('2d', { alpha:true });
      if (!ctx) return;

      // The original Dustry Labs boot background is 1672 x 941.
      // Paths track recognizable wires from the actual background artwork.
      const sourceW = 1672, sourceH = 941;
      const routes = [
        {color:'#ff9a2f',speed:130,phase:0.14,  points:[[322,30],[798,30]]},
        {color:'#ff9a2f',speed:115,phase:0.53,  points:[[322,91],[708,91],[708,398]]},
        {color:'#ff9a2f',speed:100,phase:0.3,   points:[[322,120],[693,120],[693,536]]},
        {color:'#20d9ce',speed:95, phase:0.27,  points:[[517,233],[501,268],[501,444],[700,444],[700,732]]},
        {color:'#34e2d5',speed:142,phase:0.41,  points:[[527,270],[1059,270],[1059,411],[1418,411]]},
        {color:'#30d6ed',speed:125,phase:0.16,  points:[[1420,289],[1619,289],[1619,691]]},
        {color:'#fd468a',speed:105,phase:0.58,  points:[[1061,5],[1061,447],[1187,447]]},
        {color:'#bb5ef9',speed:96, phase:0.66,  points:[[1250,455],[1250,693],[1451,693]]},
        {color:'#40c4ff',speed:110,phase:0.84,  points:[[327,432],[327,649],[508,649]]},
        {color:'#f9a04d',speed:106,phase:0.1,   points:[[792,31],[792,259],[1057,259]]},
        {color:'#32f0d0',speed:100,phase:0.75,  points:[[1451,421],[1451,657],[1522,657]]},
        {color:'#39bde5',speed:112,phase:0.27,  points:[[516,438],[516,737],[756,737]]}
      ];
      const motionReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      let dpr=1, w=0, h=0, raf=0, elapsed=0, then=0;

      function resize() {
        const bounds=scene.getBoundingClientRect();
        // Use layout dimensions, not transformed dimensions (CSS moves/zooms the scene).
        w=scene.clientWidth;
        h=scene.clientHeight;
        dpr=Math.min(window.devicePixelRatio||1,1.6);
        canvas.width=Math.round(w*dpr);
        canvas.height=Math.round(h*dpr);
        canvas.style.width=w+'px';
        canvas.style.height=h+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      function imageCoords(pt) {
        const cover=Math.max(w/sourceW,h/sourceH);
        const x0=(w-sourceW*cover)*.5;
        const y0=(h-sourceH*cover)*.5;
        return [x0+pt[0]*cover, y0+pt[1]*cover];
      }
      function pointAlong(path, distance) {
        const lengths=[]; let total=0;
        for(let i=1;i<path.length;i++){
          const dx=path[i][0]-path[i-1][0];
          const dy=path[i][1]-path[i-1][1];
          const len=Math.hypot(dx,dy);
          lengths.push(len); total+=len;
        }
        if (total===0) return path[0];
        let remain=((distance%total)+total)%total;
        for(let i=0;i<lengths.length;i++){
          if(remain<=lengths[i]||i===lengths.length-1){
            const frac=lengths[i]?remain/lengths[i]:0;
            return [path[i][0]+(path[i+1][0]-path[i][0])*frac,
                    path[i][1]+(path[i+1][1]-path[i][1])*frac];
          }
          remain-=lengths[i];
        }
        return path[path.length-1];
      }
      function draw() {
        ctx.clearRect(0,0,w,h);
        if (motionReduced.matches) return;
        for(const route of routes){
          const pts=route.points.map(imageCoords);
          const lengths=pts.slice(1).map((p,i)=>Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]));
          const total=lengths.reduce((a,b)=>a+b,0);
          if (total<1) continue;
          // Signal track, faint enough to keep the background understated.
          ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
          for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
          ctx.strokeStyle=route.color+'23';
          ctx.lineWidth=2.5; ctx.stroke();
          for(let pulse=0;pulse<2;pulse++){
            const d=(elapsed*route.speed + total*(route.phase+pulse*.5))%total;
            const head=pointAlong(pts,d);
            // Luminous streaming tail, following bends rather than cutting corners.
            for(let k=10;k>=0;k--){
              const tail=pointAlong(pts,d-k*4.4);
              // Do not connect the last point to the first when a tail wraps.
              if (d-(k+1)*4.4 < 0) continue;
              const next=pointAlong(pts,d-(k+1)*4.4);
              ctx.beginPath();ctx.moveTo(tail[0],tail[1]);ctx.lineTo(next[0],next[1]);
              ctx.strokeStyle=route.color;
              ctx.globalAlpha=.08+.55*(1-k/11);
              ctx.lineWidth=Math.max(1.2,3.5-k*.19);
              ctx.stroke();
            }
            ctx.globalAlpha=1;
            const halo=ctx.createRadialGradient(head[0],head[1],0,head[0],head[1],19);
            halo.addColorStop(0,route.color+'b0');
            halo.addColorStop(.25,route.color+'50');
            halo.addColorStop(1,route.color+'00');
            ctx.fillStyle=halo;
            ctx.beginPath();ctx.arc(head[0],head[1],19,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#f0fbff';
            ctx.beginPath();ctx.arc(head[0],head[1],2.9,0,Math.PI*2);ctx.fill();
          }
        }
      }
      function frame(now) {
        if (!then) then=now;
        elapsed+=Math.min((now-then)/1000,.06);
        then=now;
        draw();
        raf=requestAnimationFrame(frame);
      }
      function start() {
        cancelAnimationFrame(raf);
        if (motionReduced.matches || document.hidden) {draw();return;}
        then=0;raf=requestAnimationFrame(frame);
      }
      window.addEventListener('resize',()=>{resize();draw();},{passive:true});
      document.addEventListener('visibilitychange',start);
      if (motionReduced.addEventListener) motionReduced.addEventListener('change',start);
      resize();start();
    })();
  </script>

  <script>
    // One shared public statistics response, with HTTP and per-browser caching.
    (() => {
      'use strict';
      const API_URL = 'https://game.mindustry.ru/api/v1/public/stats';
      const CACHE_KEY = 'dustry_public_stats_v2';
      const TTL_MS = 5 * 60 * 1000;
      const MAX_STALE_MS = 10 * 60 * 1000;
      const players = document.getElementById('stat-players');
      const saves = document.getElementById('stat-saves');
      const server = document.getElementById('stat-server');
      const version = document.getElementById('stat-version');
      const dot = document.getElementById('live-dot');
      const format = new Intl.NumberFormat('ru-RU');
      let lastFetchAt = 0;
      let inFlight = false;

      function getCached() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (_) { return null; }
      }
      function setCached(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
      }
      function showOnline(data) {
        players.textContent = format.format(data.registered_players);
        saves.textContent = format.format(data.saved_slots);
        version.textContent = data.game_version ? 'v' + data.game_version : '—';
        server.textContent = 'Онлайн';
        server.classList.add('is-online');
        server.classList.remove('is-offline');
        dot.classList.remove('is-offline');
        dot.classList.add('is-online');
        dot.setAttribute('aria-label', 'Сервер онлайн');
        dot.title = 'Сервер онлайн';
      }
      function showOffline() {
        players.textContent = '—';
        saves.textContent = '—';
        version.textContent = '—';
        server.textContent = 'Нет связи';
        server.classList.remove('is-online');
        server.classList.add('is-offline');
        dot.classList.remove('is-online');
        dot.classList.add('is-offline');
        dot.setAttribute('aria-label', 'Нет связи с сервером');
        dot.title = 'Нет связи с сервером';
      }
      function valid(data) {
        return data && data.ok === true && data.server_status === 'online' &&
          Number.isSafeInteger(data.registered_players) && data.registered_players >= 0 &&
          Number.isSafeInteger(data.saved_slots) && data.saved_slots >= 0 &&
          (data.game_version == null || /^\d+\.\d+\.\d+$/.test(data.game_version));
      }
      async function refresh(force = false) {
        if (inFlight || document.hidden) return;
        const now = Date.now();
        const cached = getCached();
        if (!force && cached && valid(cached.data) &&
            now >= cached.savedAt && now - cached.savedAt < TTL_MS) {
          showOnline(cached.data);
          return;
        }
        // Prevent repeated requests from rapid tab switches or connection failures.
        if (now - lastFetchAt < 30000) return;
        lastFetchAt = now;
        inFlight = true;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6500);
        try {
          // Let the browser use Cache-Control rather than forcing a request on each visit.
          const response = await fetch(API_URL, {
            signal: controller.signal, cache: 'default', mode: 'cors', credentials: 'omit'
          });
          if (!response.ok) throw new Error('Stats unavailable');
          const data = await response.json();
          if (!valid(data)) throw new Error('Invalid stats payload');
          showOnline(data);
          setCached({data, savedAt: Date.now()});
        } catch (_) {
          // Short network hiccup: keep recently obtained totals, but never mark them live forever.
          if (cached && valid(cached.data) && now >= cached.savedAt &&
              now - cached.savedAt < MAX_STALE_MS) {
            players.textContent = format.format(cached.data.registered_players);
            saves.textContent = format.format(cached.data.saved_slots);
            version.textContent = cached.data.game_version ? 'v' + cached.data.game_version : '—';
          } else {
            players.textContent = '—'; saves.textContent = '—'; version.textContent = '—';
          }
          server.textContent = 'Нет связи';
          server.classList.remove('is-online'); server.classList.add('is-offline');
          dot.classList.remove('is-online'); dot.classList.add('is-offline');
          dot.setAttribute('aria-label', 'Нет связи с сервером');
          dot.title = 'Нет связи с сервером';
        } finally {
          clearTimeout(timer);
          inFlight = false;
        }
      }

      const cached = getCached();
      if (cached && valid(cached.data) && Date.now() - cached.savedAt < TTL_MS &&
          Date.now() >= cached.savedAt) showOnline(cached.data);
      else {
        server.textContent = 'Проверка…';
        server.classList.remove('is-online', 'is-offline');
        dot.classList.remove('is-online', 'is-offline');
        dot.setAttribute('aria-label', 'Проверка связи с сервером');
        dot.title = 'Проверка связи с сервером';
      }
      refresh();
      setInterval(() => { if (!document.hidden) refresh(); }, TTL_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      window.addEventListener('storage', event => {
        if (event.key === CACHE_KEY && !document.hidden) refresh();
      });
    })();
  </script>
</body>
</html>
